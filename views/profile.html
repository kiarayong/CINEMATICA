
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/profile.css">
    <title>User Profile</title>
</head>
<body>
    <header>
        <a href="/">Home</a>
        <div class="authenticatedSection">
            <a href="/addMovie">Add new movie</a>
            <a href="/playlist">My Playlist</a>
            <a href="/profile">My Profile</a>
            <a href="#" id="logoutLink">Logout</a>
        </div>
        <div class="unauthenticatedSection">
            <a href="/login">Login</a>
        </div>
    </header>
    <h1>User Profile</h1>
    <form id="updateProfileForm">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" readonly>
        <input type="text" id="newName" name="newName" placeholder="New Name">

        <label for="email">Email:</label>
        <input type="text" id="email" name="email" readonly>
        <input type="email" id="newEmail" name="newEmail" placeholder="New Email">

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" readonly>
        <input type="password" id="newPassword" name="newPassword" placeholder="New Password">

        <button type="submit">Update Profile</button>
    </form>
    <script src="./js/jquery.min.js"></script>
    <script src="./js/profile.js"></script>
    <script src="./js/auth.js"></script>
</body>
</html>
