<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PT2</title>
</head>
<body>
    <header>
        <a href="/">Home</a>
        <div class="authenticatedSection">
            <a href="/addMovie">Add new movie</a>
            <a href="#" id="logoutLink">Logout</a>
        </div>
        <div class="unauthenticatedSection">
            <a href="/login">Login</a>
        </div>
    </header>
    <div class="authenticatedSection">
        <h1>Add Movie</h1>
        <form id="addMovieForm">
            <label for="title">Title:</label>
            <input type="text" name="title" id="title"><br>
            <label for="description">Description: </label>
            <input type="text" name="description" id="description"><br>
            <label for="genre">Genre:</label>
            <input type="text" name="genre" id="genre"><br>
            <label for="image">Image:</label>
            <input type="text" name="image" id="image"><br>
            <label for="cinema">Cinema</label>
            <select name="cinemaId" id="cinema">
                <option value="-1" disabled selected>&nbsp;</option>
                <!-- Remove the following hardcoded options. 
                    The options must be dynamically loaded from the database
                 -->
                 <option value="64435f6e71fc032666f5dd36">GV Plaza</option>
                 <option value="64435f6e71fc032666f5dd37">GV Tampines</option>
                 <option value="64435f6e71fc032666f5dd38">GV Vivocity</option>
            </select><br>
            <input type="submit" value="Add Movie">
        </form>
        <div id="statusMessage"></div>
    </div>
    <div class="unauthenticatedSection">
        <p>
            You are not allowed to add new movie. Please <a href="/login">login</a> first.
        </p>
    </div>

    <script src="./js/jquery.min.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/addMovie.js"></script>
</body>
</html>
